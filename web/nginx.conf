# Configurația nginx pentru serviciul `web`.
# 1) Servește fișierele statice ale SPA-ului (HTML/CSS/JS).
# 2) Trimite cererile /api/... mai departe la serviciile Python (reverse proxy).
#    Așa browserul vorbește cu o singură adresă (localhost:8090)
#    și nu avem probleme de CORS.

server {
    listen 80;

    root  /usr/share/nginx/html;
    index index.html;

    # Fișierele audio trimise de microfon pot avea câțiva MB
    client_max_body_size 10m;

    # 127.0.0.11 = serverul DNS intern al Docker. Cu numele serviciilor puse în
    # variabile, nginx le caută abia la fiecare cerere, nu la pornire.
    # Așa nginx pornește chiar dacă `api` sau `speech` nu sunt încă gata.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream    http://api:5000;
    set $speech_upstream http://speech:5001;

    # Comenzile vocale (fișiere WAV) merg la serviciul „speech”.
    # nginx alege regula cu prefixul cel mai lung, deci aceasta are prioritate față de /api/.
    location /api/command {
        proxy_pass $speech_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /api/speech/ {
        proxy_pass $speech_upstream;
    }

    # Restul cererilor /api/ (rețetele) merg la serviciul „api”.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Restul: fișiere statice. Dacă fișierul nu există, întoarcem index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
